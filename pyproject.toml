[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-mfb"
version = "0.1.0"
description = "PQC-MFB: the Post-Quantum Migration Failure Benchmark — 322 cases, 39 failure families, 10 unrepaired designs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PQC Migration Safety Lab" }]
keywords = ["post-quantum", "benchmark", "security", "migration", "ML-KEM", "dataset"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
pqc-mfb = "pqc_mfb.cli:main"

[project.urls]
Homepage = "https://github.com/nickharris808/pqc-mfb"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqc_mfb = ["py.typed", "data/*.jsonl", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
